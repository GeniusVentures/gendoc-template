name: Deploy GenDoc (Ask Worker and Pages)

on:
  workflow_call:
    inputs:
      template-path:
        description: Path to the gendoc-template checkout inside the parent repo
        required: false
        default: gendoc-template
        type: string
      python-version:
        description: Python version used for the documentation build
        required: false
        default: "3.11"
        type: string
      siblings:
        description: >-
          Space-separated sibling repository specs, cloned in parallel with
          the parent. Each spec is "owner/repo:path" or "owner/repo:path@ref".
          Path is relative to the workspace root; the parent is checked out
          to ./parent, so use a sibling directory name (e.g. "SuperGenius")
          to get the local-monorepo layout that gendoc.yml's "../Sibling/..."
          source_references expect.
        required: false
        default: ""
        type: string
      siblings-token:
        description: >-
          Token used to clone private sibling repos. Defaults to the workflow's
          GITHUB_TOKEN, which works for public repos and same-org private repos
          when the workflow's permissions allow it.
        required: false
        default: ""
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token with Pages and Workers edit access
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account identifier
        required: true

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      TEMPLATE_PATH: parent/${{ inputs.template-path }}

    steps:
      # Clone the parent and all sibling repositories concurrently. Doing it
      # in one step with backgrounded git clones is faster than N sequential
      # actions/checkout invocations and lets the parent land in ./parent so
      # siblings can sit next to it (matching a local monorepo layout).
      - name: Clone parent and sibling repositories in parallel
        env:
          SIBLINGS: ${{ inputs.siblings }}
          CLONE_TOKEN: ${{ inputs.siblings-token != '' && inputs.siblings-token || github.token }}
          PARENT_REPO: ${{ github.repository }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          set -u

          # Use insteadOf so the token never lands in any repo's .git/config.
          # Cover both HTTPS and SSH-style GitHub URLs so submodules that
          # reference git@github.com:... also pick up token auth.
          git config --global \
            url."https://x-access-token:${CLONE_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git config --global --add \
            url."https://x-access-token:${CLONE_TOKEN}@github.com/".insteadOf \
            "git@github.com:"

          clone_one() {
            local repo="$1" path="$2" ref="${3:-}"
            local args=(--recurse-submodules)
            if [ -n "$ref" ]; then
              args+=(--branch "$ref")
            fi
            git clone "${args[@]}" "https://github.com/${repo}.git" "$path"
          }

          pids=()
          labels=()

          # Parent: full clone (needed for any git-derived build metadata).
          echo "Cloning parent $PARENT_REPO -> parent (sha: $PARENT_SHA)"
          (
            git clone --recurse-submodules --quiet --no-checkout \
              "https://github.com/${PARENT_REPO}.git" parent \
              && git -C parent checkout --quiet "$PARENT_SHA" \
              && git -C parent submodule update --init --recursive
          ) &
          pids+=($!)
          labels+=("$PARENT_REPO (parent)")

          # Siblings: shallow when a ref is given, otherwise default-branch tip.
          for spec in $SIBLINGS; do
            repo="${spec%%:*}"
            rest="${spec#*:}"
            path="${rest%%@*}"
            ref=""
            [[ "$rest" == *"@"* ]] && ref="${rest##*@}"
            echo "Cloning sibling $repo -> $path (ref: ${ref:-default})"
            clone_one "$repo" "$path" "$ref" &
            pids+=($!)
            labels+=("$repo")
          done

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::clone failed: ${labels[$i]}"
              failed=1
            fi
          done

          # Scrub both insteadOf values so the token can't leak via later git ops.
          # --unset-all because we used --add for the second entry.
          git config --global --unset-all \
            url."https://x-access-token:${CLONE_TOKEN}@github.com/".insteadOf || true

          [ "$failed" -eq 0 ] || exit 1
          echo "All clones complete."

          # Verify the layout so silent clone failures are visible in the log.
          echo "--- workspace contents ---"
          ls -la
          for spec in $SIBLINGS; do
            rest="${spec#*:}"
            path="${rest%%@*}"
            echo "--- $path ---"
            if [ -d "$path" ]; then
              du -sh "$path"
              echo "  source files: $(find "$path" -name '*.cpp' -o -name '*.hpp' 2>/dev/null | wc -l)"
              echo "  submodule status:"
              git -C "$path" submodule status --recursive || true
              echo "  gendoc.yml INPUT dirs:"
              for d in src example ProofSystem/include ProofSystem/src \
                       ProofSystem/SGProofCircuits/src ProofSystem/SGProofCircuits/include \
                       SGProcessingManager/include SGProcessingManager/src \
                       gRPCForSuperGenius/proto-include GeniusKDF/src \
                       evmrelay/src evmrelay/include evmrelay/examples; do
                if [ -d "$path/$d" ]; then
                  echo "    OK      $d ($(find "$path/$d" -type f 2>/dev/null | wc -l | tr -d ' ') files)"
                else
                  echo "    MISSING $d"
                fi
              done
            else
              echo "::error::$path does not exist after clone"
              exit 1
            fi
          done

      - name: Validate parent-project layout
        run: |
          test -f parent/gendoc.yml
          test -f "$TEMPLATE_PATH/mkdocs.yml"
          test -f "$TEMPLATE_PATH/scripts/build.sh"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: parent/${{ inputs.template-path }}/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install -r "$TEMPLATE_PATH/requirements.txt"
          python -m pip install -e "$TEMPLATE_PATH/plugins"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen
          bash "$TEMPLATE_PATH/scripts/install-deps.sh"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      # Deploy first so deploy-ask.sh can capture a worker URL when the host
      # does not configure llms.ask.endpoint explicitly. A configured endpoint
      # normally denotes a shared/external Worker, so leave it untouched unless
      # llms.ask.deploy_worker is explicitly enabled.
      - name: Deploy Ask AI Worker
        working-directory: parent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if python - <<'PYTHON'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("gendoc.yml").read_text(encoding="utf-8")) or {}
          llms = config.get("llms") or {}
          ask = llms.get("ask") or {}
          deploy_worker = ask.get("deploy_worker", not bool(ask.get("endpoint")))
          raise SystemExit(0 if llms.get("enabled") and ask.get("enabled") and deploy_worker else 1)
          PYTHON
          then
            bash "${{ inputs.template-path }}/scripts/deploy-ask.sh" gendoc.yml
          else
            echo "Ask AI Worker is disabled or externally managed; skipping Worker deployment."
          fi

      - name: Generate Wrangler configuration
        working-directory: parent
        run: |
          python - "${{ inputs.template-path }}" <<'PYTHON'
          from pathlib import Path
          import sys
          import yaml

          template_root = Path(sys.argv[1])
          config = yaml.safe_load(Path("gendoc.yml").read_text(encoding="utf-8")) or {}
          cloudflare = config.get("deploy", {}).get("cloudflare", {})
          project = cloudflare.get("pages_project_name")
          if not project:
              raise SystemExit("deploy.cloudflare.pages_project_name is required")

          compatibility_date = cloudflare.get("compatibility_date", "2024-01-01")
          site_dir = config.get("mkdocs", {}).get("site_dir", "site")
          source = (template_root / "wrangler.toml.template").read_text(encoding="utf-8")
          output = (
              source.replace("{{PAGES_PROJECT_NAME}}", str(project))
              .replace("{{COMPATIBILITY_DATE}}", str(compatibility_date))
              .replace("{{SITE_DIR}}", str(site_dir))
          )
          (template_root / "wrangler.toml").write_text(output, encoding="utf-8")
          PYTHON

      - name: Build documentation
        working-directory: parent
        run: bash "${{ inputs.template-path }}/scripts/build.sh"

      - name: Deploy to Cloudflare Pages
        working-directory: parent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash "${{ inputs.template-path }}/scripts/deploy.sh"
