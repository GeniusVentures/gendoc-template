name: Repair develop TypeScript

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Repair develop TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Fix malformed regular expressions and verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" clone --branch develop --single-branch "https://github.com/$REPOSITORY.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ask-ai/worker/src/index.ts')
          text = path.read_text()
          old = """    const path = url.pathname.replace(/\\\\/index\\\\.html$/i, '/');
              return path.length > 1 ? path.replace(/\\\\/+$/, '') : path;
          """
          new = """    const path = url.pathname.replace(/\/index\.html$/i, '/');
              return path.length > 1 ? path.replace(/\/+$/, '') : path;
          """
          if old not in text:
              raise SystemExit('expected malformed regex block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci --prefix ask-ai/worker --silent
          npm run typecheck --prefix ask-ai/worker -- --pretty false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ask-ai/worker/src/index.ts
          git commit -m "fix(ask): correct documentation path regex"
          git -c http.extraheader="$auth" push origin HEAD:develop
