name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-typescript:
    name: Diagnose TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce worker typecheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -o pipefail
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            clone --depth 1 "https://github.com/$REPOSITORY.git" repo
          cd repo
          git fetch --depth 1 origin "$REF"
          git checkout --detach FETCH_HEAD
          node --version
          npm --version
          npm ci --prefix ask-ai/worker --silent
          npm run typecheck --prefix ask-ai/worker -- --pretty false
